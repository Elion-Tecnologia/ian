name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Ian.slnx

      - name: Build
        run: dotnet build Ian.slnx --configuration Release --no-restore

      - name: Test
        id: tests
        run: >-
          dotnet test Ian.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=ian-tests"
          --results-directory "${{ runner.temp }}/ian-test-results"

      - name: Upload test report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ian-test-results
          path: ${{ runner.temp }}/ian-test-results/*.trx
          if-no-files-found: warn
          retention-days: 7