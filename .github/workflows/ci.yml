name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ian_t22_tests
          POSTGRES_USER: ian_test
          POSTGRES_PASSWORD: ian_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ian_test -d ian_t22_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Ian.slnx

      - name: Build
        run: dotnet build Ian.slnx --configuration Release --no-restore

      - name: Test
        id: tests
        run: >-
          dotnet test Ian.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFilePrefix=ian-tests"
          --results-directory "${{ runner.temp }}/ian-test-results"

      - name: Test agenda, conversation and confirmation persistence
        id: persistence-tests
        env:
          IAN_TEST_POSTGRES_DATABASE: ian_t22_tests
          IAN_TEST_POSTGRES_CONNECTION_STRING: Host=127.0.0.1;Database=ian_t22_tests;Username=ian_test;Password=ian_test_local
        run: >-
          dotnet test Ian.Tests/Ian.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "FullyQualifiedName~OperationConfirmationPostgresTests|FullyQualifiedName~PendingConversationPostgresTests|FullyQualifiedName~EdicaoAgendamentoPostgresTests|FullyQualifiedName~CriacaoAgendamentoPostgresTests|FullyQualifiedName~ConsultaAgendaPostgresTests|FullyQualifiedName~AgendaConcurrencyPostgresTests|FullyQualifiedName~EncerramentoAgendamentoPostgresTests|FullyQualifiedName~TelegramAgentPostgresTests"
          --logger "trx;LogFilePrefix=ian-persistence-tests"
          --results-directory "${{ runner.temp }}/ian-test-results"

      - name: Upload test report
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: ian-test-results
          path: ${{ runner.temp }}/ian-test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
